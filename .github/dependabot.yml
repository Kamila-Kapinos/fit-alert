# Dependabot opens PRs only for security alerts (version updates disabled via limit 0).
# All security fixes for npm are grouped into a single PR.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
